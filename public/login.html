<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Sign In | Yakshith Nandh Travels</title>
  
  <meta name="theme-color" content="#7B263A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #FFF9F0 0%, #F5EBDD 65%, #E8DAC6 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: var(--font-body);
      color: var(--color-text-main);
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 2px solid var(--color-border-gold);
      border-radius: var(--radius-lg);
      box-shadow: 0 16px 40px rgba(123, 38, 58, 0.12), 0 2px 10px rgba(57, 43, 39, 0.05);
      padding: 2.4rem 2.2rem;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.4s ease-out;
    }

    .login-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--color-primary), var(--color-accent-gold), var(--color-primary));
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-brand-header {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .login-crest {
      width: 54px;
      height: 54px;
      background: var(--color-primary);
      border: 2px solid var(--color-accent-gold);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-weight: 800;
      color: #FFF9F0;
      font-size: 1.4rem;
      margin: 0 auto 12px;
      box-shadow: 0 6px 16px rgba(123, 38, 58, 0.25);
    }

    .login-brand-header h1 {
      font-family: var(--font-heading);
      font-size: 1.55rem;
      color: var(--color-primary);
      margin: 0 0 4px;
      line-height: 1.2;
    }

    .login-brand-header p {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Error Alert */
    .login-alert {
      display: none;
      background: #FFEBEE;
      border: 1px solid #FFCDD2;
      color: #C62828;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      align-items: center;
      gap: 8px;
      animation: shake 0.3s ease;
    }

    .login-alert.visible {
      display: flex;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--color-text-main);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      width: 18px;
      height: 18px;
      fill: var(--color-text-muted);
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg-ivory);
      font-family: var(--font-body);
      font-size: 0.92rem;
      color: var(--color-text-main);
      transition: var(--transition-fast);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--color-primary);
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(123, 38, 58, 0.12);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      color: var(--color-primary);
    }

    .password-toggle svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.4rem;
      font-size: 0.82rem;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--color-primary);
      color: #FFF9F0;
      border: 1.5px solid var(--color-accent-gold);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover {
      background: var(--color-primary-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Demo Credentials Callout */
    .credentials-hint {
      margin-top: 1.4rem;
      background: var(--color-bg-ivory);
      border: 1px dashed var(--color-border-gold);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.8rem;
      color: var(--color-text-muted);
      text-align: center;
    }

    .credentials-hint code {
      background: rgba(123, 38, 58, 0.08);
      color: var(--color-primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-family: monospace;
    }

    .back-home-link {
      margin-top: 1.5rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--color-primary);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 600;
      transition: var(--transition-fast);
    }

    .back-home-link:hover {
      color: var(--color-accent-gold-dark);
      transform: translateX(-3px);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-brand-header">
      <div class="login-crest">YN</div>
      <h1>Admin & Dispatch Portal</h1>
      <p>Yakshith Nandh Travels • Tirupati</p>
    </div>

    <div id="loginAlert" class="login-alert" role="alert">
      <svg style="width:18px;height:18px;flex-shrink:0;fill:currentColor" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <span id="loginAlertText">Invalid email or password.</span>
    </div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminEmail" class="form-label">Admin Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          <input type="text" id="adminEmail" class="form-control" placeholder="admin@yakshithnandhtravels.com" autocomplete="username" required autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="adminPassword" class="form-label">Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24">
            <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
          </svg>
          <input type="password" id="adminPassword" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" id="togglePasswordBtn" class="password-toggle" title="Show or hide password" aria-label="Toggle password visibility">
            <svg id="eyeIcon" viewBox="0 0 24 24">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" checked>
          <span>Remember session</span>
        </label>
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn-login">
        <span>Sign In to Console</span>
        <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24">
          <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-7.85-1.42 1.42L16.86 11H5v2z"/>
        </svg>
      </button>
    </form>

    <div class="credentials-hint">
      <strong>Default Admin Credentials:</strong><br>
      Email: <code>admin@yakshithnandhtravels.com</code><br>
      Password: <code>admin</code>
    </div>
  </div>

  <a href="/" class="back-home-link">
    ← Return to Customer Website
  </a>

  <script src="login.js"></script>
</body>
</html>
